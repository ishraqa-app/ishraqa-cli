name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Help and version run without network
        run: |
          node bin/ishraqa.js --version
          node bin/ishraqa.js --help
      - name: Package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm pack --dry-run

  smoke:
    name: Live smoke (public content)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/ishraqa.js --help --no-color
      # signed out, content commands must refuse with exit code 4
      - run: set +e; node bin/ishraqa.js today --no-color; test $? -eq 4
        shell: bash
